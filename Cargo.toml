[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"

[workspace.dependencies]
noxis-analysis = { path = "crates/noxis-analysis" }
noxis-classfile = { path = "crates/noxis-classfile" }
noxis-core = { path = "crates/noxis-core" }
noxis-jar = { path = "crates/noxis-jar" }
noxis-passes = { path = "crates/noxis-passes" }
noxis-runtime = { path = "crates/noxis-runtime" }
noxis-structure-check = { path = "crates/noxis-structure-check" }
noxis-verify = { path = "crates/noxis-verify" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
